name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: ./scripts/test.sh

      - name: Bundle
        run: ./scripts/bundle.sh "${GITHUB_REF_NAME#v}"

      - name: Disk image
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version//\//-}"
          app_name="边框水印大师"
          staging="build/dmg-staging"
          rm -rf "$staging"
          mkdir -p "$staging"
          ditto "build/${app_name}.app" "$staging/${app_name}.app"
          ln -s /Applications "$staging/Applications"
          rm -f "BorderMark-${version}.dmg"
          hdiutil create \
            -volname "$app_name" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "BorderMark-${version}.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: BorderMark-dmg
          path: BorderMark-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BorderMark-dmg
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/BorderMark-${version}.dmg" \
            --repo "$GH_REPO" \
            --title "边框水印大师 ${version}" \
            --notes "$(cat <<EOF
          macOS 安装包是 \`BorderMark-${version}.dmg\`。打开后把「边框水印大师」拖到「应用程序」。

          当前为 ad-hoc 签名，未做公证。如果系统拦截，到「系统设置 → 隐私与安全性」里允许打开。
          EOF
          )"
