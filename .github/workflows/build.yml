name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: ./scripts/test.sh

      - name: Bundle
        run: ./scripts/bundle.sh "${GITHUB_REF_NAME#v}"

      - name: Zip
        run: ditto -c -k --keepParent "build/边框水印大师.app" BorderMark-macOS.zip

      - name: Disk image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_name="边框水印大师"
          staging="build/dmg-staging"
          rm -rf "$staging"
          mkdir -p "$staging"
          ditto "build/${app_name}.app" "$staging/${app_name}.app"
          ln -s /Applications "$staging/Applications"
          rm -f "BorderMark-${version}.dmg"
          hdiutil create \
            -volname "$app_name" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "BorderMark-${version}.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: BorderMark-macOS
          path: BorderMark-macOS.zip

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: BorderMark-dmg
          path: BorderMark-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BorderMark-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "边框水印大师 ${version}" \
            --notes "$(cat <<EOF
          macOS 安装包，当前为 ad-hoc 签名，未做公证。

          - \`BorderMark-macOS.zip\`：解压后打开「边框水印大师」
          - \`BorderMark-${version}.dmg\`：打开后把应用拖到「应用程序」

          如果系统拦截，到「系统设置 → 隐私与安全性」里允许打开。
          EOF
          )"
